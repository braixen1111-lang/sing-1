name: Build MaqamLive APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'MaqamLive-Android-source.zip'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  android-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Extract Android project source
        run: |
          test -f MaqamLive-Android-source.zip || { echo 'Missing source archive'; exit 1; }
          unzip -q MaqamLive-Android-source.zip
          test -f MaqamLive-Android/app/build.gradle.kts
      - name: Configure Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK tools
        uses: android-actions/setup-android@v4
      - name: Install Android API 35 and build tools
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Configure Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: MaqamLive-Android
        run: run: sed -i 's/fillViewport/isFillViewport/g' app/src/main/java/com/maqamlive/app/MainActivity.kt && gradle :app:assembleDebug --no-daemon --stacktrace
      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: MaqamLive-debug-APK
          path: MaqamLive-Android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
